name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Generate version.json
        run: |
          BUILD_TIME=$(date +%s%3N)
          COMMIT_SHA=$(git rev-parse --short HEAD || echo "latest")
          COMMIT_MSG=$(git log -1 --pretty=%s | tr '"' "'" || echo "Updated website")
          mkdir -p public
          echo "{\"version\": \"1.0.$(date +%y%m%d%H%M)\", \"buildTime\": $BUILD_TIME, \"commit\": \"$COMMIT_SHA\", \"message\": \"$COMMIT_MSG\"}" > public/version.json

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
