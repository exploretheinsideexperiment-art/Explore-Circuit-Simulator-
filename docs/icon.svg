<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#040810" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#00bbf9" />
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bg)" stroke="#1e293b" stroke-width="4" />

  <!-- Circuit Traces Grid -->
  <g stroke="#1e3a5f" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <path d="M 64 128 H 180 L 220 180" />
    <path d="M 64 256 H 170" />
    <path d="M 64 384 H 190 L 220 330" />
    <path d="M 448 128 H 332 L 292 180" />
    <path d="M 448 256 H 342" />
    <path d="M 448 384 H 322 L 292 330" />
    <path d="M 128 64 V 170" />
    <path d="M 256 64 V 160" />
    <path d="M 384 64 V 170" />
    <path d="M 128 448 V 342" />
    <path d="M 256 448 V 352" />
    <path d="M 384 448 V 342" />
  </g>

  <!-- Circuit Pads / Nodes -->
  <g fill="#00bbf9">
    <circle cx="64" cy="128" r="7" />
    <circle cx="64" cy="256" r="7" />
    <circle cx="64" cy="384" r="7" />
    <circle cx="448" cy="128" r="7" />
    <circle cx="448" cy="256" r="7" />
    <circle cx="448" cy="384" r="7" />
    <circle cx="128" cy="64" r="7" />
    <circle cx="256" cy="64" r="7" />
    <circle cx="384" cy="64" r="7" />
    <circle cx="128" cy="448" r="7" />
    <circle cx="256" cy="448" r="7" />
    <circle cx="384" cy="448" r="7" />
  </g>

  <!-- Central Microcontroller Body -->
  <rect x="176" y="176" width="160" height="160" rx="16" fill="url(#chipGrad)" stroke="#00f5d4" stroke-width="4" filter="url(#glow)" />

  <!-- IC Pins -->
  <!-- Top Pins -->
  <g fill="#94a3b8">
    <rect x="196" y="156" width="12" height="20" rx="2" />
    <rect x="224" y="156" width="12" height="20" rx="2" />
    <rect x="250" y="156" width="12" height="20" rx="2" />
    <rect x="276" y="156" width="12" height="20" rx="2" />
    <rect x="304" y="156" width="12" height="20" rx="2" />
    <!-- Bottom Pins -->
    <rect x="196" y="336" width="12" height="20" rx="2" />
    <rect x="224" y="336" width="12" height="20" rx="2" />
    <rect x="250" y="336" width="12" height="20" rx="2" />
    <rect x="276" y="336" width="12" height="20" rx="2" />
    <rect x="304" y="336" width="12" height="20" rx="2" />
    <!-- Left Pins -->
    <rect x="156" y="196" width="20" height="12" rx="2" />
    <rect x="156" y="224" width="20" height="12" rx="2" />
    <rect x="156" y="250" width="20" height="12" rx="2" />
    <rect x="156" y="276" width="20" height="12" rx="2" />
    <rect x="156" y="304" width="20" height="12" rx="2" />
    <!-- Right Pins -->
    <rect x="336" y="196" width="20" height="12" rx="2" />
    <rect x="336" y="224" width="20" height="12" rx="2" />
    <rect x="336" y="250" width="20" height="12" rx="2" />
    <rect x="336" y="276" width="20" height="12" rx="2" />
    <rect x="336" y="304" width="20" height="12" rx="2" />
  </g>

  <!-- Pin 1 Marker -->
  <circle cx="196" cy="196" r="6" fill="#00f5d4" />

  <!-- Core Circuit / "E" & Pulse Symbol inside IC -->
  <path d="M 226 216 H 286 M 226 256 H 270 M 226 296 H 286" stroke="url(#cyanGrad)" stroke-width="5" stroke-linecap="round" />
  <path d="M 226 216 V 296" stroke="url(#cyanGrad)" stroke-width="5" stroke-linecap="round" />
  
  <!-- Pulse Wave Graphic -->
  <path d="M 244 256 L 254 238 L 264 274 L 274 246 L 284 256 H 294" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
